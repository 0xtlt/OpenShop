name: Release npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment; auto reads conventional commits since the published version
        required: true
        default: auto
        type: choice
        options:
          - auto
          - current
          - patch
          - minor
          - major

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_tag: ${{ steps.base.outputs.base_tag }}
      bump: ${{ steps.release.outputs.bump }}
      commit_count: ${{ steps.release.outputs.commit_count }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.base.outputs.target_sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Find the published version
        id: base
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node --print "require('./packages/openshop/package.json').name")"
          base_version="$(npm view "$package_name" version)"
          base_tag="v$base_version"
          target_sha="$(git rev-parse HEAD)"

          git rev-parse --verify "$base_tag^{commit}" >/dev/null
          git merge-base --is-ancestor "$base_tag" "$target_sha"

          {
            echo "base_version=$base_version"
            echo "base_tag=$base_tag"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release
        env:
          BASE_TAG: ${{ steps.base.outputs.base_tag }}
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
          RELEASE_MODE: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node --print "require('./packages/openshop/package.json').version")"
          node .github/scripts/resolve-release-version.mjs \
            --base-version "$BASE_VERSION" \
            --base-tag "$BASE_TAG" \
            --current-version "$current_version" \
            --mode "$RELEASE_MODE" >> "$GITHUB_OUTPUT"

      - name: Summarize release decision
        env:
          BASE_TAG: ${{ steps.base.outputs.base_tag }}
          BUMP: ${{ steps.release.outputs.bump }}
          COMMIT_COUNT: ${{ steps.release.outputs.commit_count }}
          SHOULD_RELEASE: ${{ steps.release.outputs.should_release }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "Release **v$VERSION** selected with **$BUMP** from $COMMIT_COUNT commit(s) after $BASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No releasable conventional commits were found after $BASE_TAG. Nothing will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish openshop
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openshop
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openshop -d openshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release automation
        run: node --test .github/scripts/*.test.mjs

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        run: createdb -h localhost -U openshop openshop_test
        env:
          PGPASSWORD: openshop

      - name: Build CLI
        run: pnpm --filter openshop run build:cli

      - name: Build docs
        run: pnpm --filter docs run build

      - name: Typecheck
        run: pnpm run check

      - name: Unit coverage
        run: pnpm run coverage:unit

      - name: Integration coverage
        run: pnpm run coverage:integration

      - name: Demo coverage
        run: pnpm run coverage:demo

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Apply release version
        working-directory: packages/openshop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - name: Smoke-test packed package
        run: pnpm --filter openshop run smoke:pack

      - name: Inspect package contents
        working-directory: packages/openshop
        run: npm pack --dry-run

      - name: Verify release target
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(node --print "require('./packages/openshop/package.json').version")" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          existing_sha="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$TARGET_SHA" ]]; then
            echo "$TAG already points to $existing_sha instead of $TARGET_SHA." >&2
            exit 1
          fi

      - name: Generate release notes
        id: notes
        env:
          BASE_TAG: ${{ needs.prepare.outputs.base_tag }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --field "tag_name=$TAG" \
            --field "target_commitish=$TARGET_SHA" \
            --field "previous_tag_name=$BASE_TAG" \
            --jq .body > "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release; skipping creation."
          else
            gh release create "$TAG" \
              --title "openshop $VERSION" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

      - name: Publish npm package
        working-directory: packages/openshop
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node --print "require('./package.json').name")"
          if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
            echo "$package_name@$VERSION is already published; skipping npm publish."
          else
            npm publish --access public
          fi

          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) to GitHub and npm." >> "$GITHUB_STEP_SUMMARY"
