server {
	listen 80;
	server_name _;

	# Keep directory redirects relative so an HTTPS reverse proxy never receives
	# a Location header that downgrades visitors to the container's HTTP scheme.
	absolute_redirect off;

	root /usr/share/nginx/html;
	index index.html;
	error_page 404 /404.html;

	location = /404.html {
		internal;
		add_header X-Robots-Tag "noindex, nofollow" always;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
