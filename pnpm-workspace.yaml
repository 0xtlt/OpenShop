packages:
  - packages/*
  - apps/*
  - docs

minimumReleaseAge: 1440

overrides:
  brace-expansion: 5.0.9
  esbuild: 0.28.2
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  immutable: 5.1.9
  js-yaml: 4.3.2
  postcss: 8.5.26
  shell-quote: 1.10.0
  ws: 8.21.3
  qs: 6.16.0
  sharp: 0.35.5
  svgo: 4.1.0
  lodash: 4.18.1
  '@graphql-codegen/plugin-helpers>lodash': 4.18.1
  picomatch: 4.0.5
  yaml: 2.9.0
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  postcss-selector-parser@<7.1.6: ^7.1.6
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - form-data@4.0.6
  - js-yaml@4.3.2
  - '@babel/core@7.29.1'
  - brace-expansion@5.0.10 || 5.0.11 || 5.0.12
  - devalue@5.9.3
  - '@fastify/busboy@3.2.1 || 3.2.2'
  - http-cache-semantics@4.2.1
  - smol-toml@1.8.1
  - source-map-js@1.2.2
  - '@graphql-tools/executor-legacy-ws@1.1.35'
  - '@graphql-tools/utils@12.0.1'
  - postcss-selector-parser@7.1.6
  - sharp@0.35.5
  - shell-quote@1.11.0

# braces has no patched release for this advisory (every version <= 3.0.3 is affected).
# It only reaches the demo app's GraphQL codegen through micromatch, never the published package.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
