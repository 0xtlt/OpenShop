packages:
  - packages/*
  - apps/*
  - docs

overrides:
  brace-expansion: 5.0.8
  esbuild: 0.28.1
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  immutable: 5.1.9
  js-yaml: 4.3.0
  postcss: 8.5.24
  shell-quote: 1.10.0
  ws: 8.21.0
  qs: 6.15.2
  lodash: 4.18.1
  '@graphql-codegen/plugin-helpers>lodash': 4.18.1
  picomatch: 4.0.4
  yaml: 2.8.4

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - form-data@4.0.6
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
