  esbuild: 0.28.2
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  immutable: 5.1.9
  js-yaml: 4.3.1
  postcss: 8.5.26
  shell-quote: 1.10.0
  ws: 8.21.3
  qs: 6.15.3
  lodash: 4.18.1
  '@graphql-codegen/plugin-helpers>lodash': 4.18.1
